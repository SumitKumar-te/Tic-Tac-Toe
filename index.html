<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="msgcontainer hide"  >
        <p id="msg">Winner</p>
    </div>

    <h1>Tic-<span id="tac">Tac</span>-Toe</h1>
    <p id="para">Classic Game | Endless Fun</p>

    <main>
        <div class="btn-container">
            <div id="btn1">
                <span id="X">X</span>

                <span id="bl">
                    <span>PLAYER X</span>
                    <span>Score: 0</span>
                </span>
            </div>

            <div id="btn2">


                <span id="bl2">
                    <span>Turn</span>
                    <span id="co">X Player</span>
                </span>
            </div>

            <div id="btn3">
                <span id="O">O</span>

                <span id="bl3">
                    <span>PLAYER O</span>
                    <span>Score: 0</span>
                </span>
            </div>
        </div>

        <section class="hero">
            <div class="border">
                <div class="bt-sz">
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                </div>
            </div>
        </section>

        <section class="features">
            <button class="newg">⟳ New Game</button>
            <button class="reset">🔁 Reset</button>
        </section>
    </main>

    <footer>
        <p class="footer">Made with ❤️ | Enjoy the game</p>
    </footer>



    <script src="script.js"></script>
</body>

</html>
